name: Build desktop artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bindings:
    name: Verify generated bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Verify generated bindings
        run: python3 tools/generate_bindings.py --check

      - name: Test binding generator
        run: python3 -m unittest tests/test_generate_bindings.py

      - name: Install Zig 0.16.0
        run: |
          curl -fsSLo "$RUNNER_TEMP/zig.tar.xz" https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Test Zig SDK
        run: |
          zig fmt --check addons/gzscript/zig examples/basic/scripts addons/gzscript/templates tests
          zig test --dep godot -Mroot=tests/zig_adapter_test.zig -Mgodot=addons/gzscript/zig/godot.zig

  build:
    name: ${{ matrix.name }}
    needs: bindings
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x86_64
            runner: macos-15
            platform: macos
            arch: x86_64
          - name: macOS ARM64
            runner: macos-15
            platform: macos
            arch: arm64
          - name: Linux x86_64
            runner: ubuntu-24.04
            platform: linux
            arch: x86_64
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - name: Windows x86_64
            runner: windows-2022
            platform: windows
            arch: x86_64
          - name: Windows ARM64
            runner: windows-11-arm
            platform: windows
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Install SCons
        run: python -m pip install --disable-pip-version-check scons==4.9.1

      - name: Build debug library
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: scons platform="$PLATFORM" target=template_debug arch="$ARCH" -j2

      - name: Build release library
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: scons platform="$PLATFORM" target=template_release arch="$ARCH" -j2

      - name: Upload platform binaries
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: gzscript-${{ matrix.platform }}-${{ matrix.arch }}
          path: addons/gzscript/bin/
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package combined artifact
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout package sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare package
        run: |
          mkdir -p dist/gzscript/addons
          cp README.md dist/gzscript/
          cp -R addons/gzscript dist/gzscript/addons/
          mkdir -p dist/gzscript/addons/gzscript/bin

      - name: Download all platform binaries
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: gzscript-*
          path: dist/gzscript/addons/gzscript/bin
          merge-multiple: true

      - name: Verify package contents
        run: |
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.macos.template_debug.x86_64.framework/libgzscript.macos.template_debug.x86_64
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.macos.template_release.x86_64.framework/libgzscript.macos.template_release.x86_64
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.macos.template_debug.arm64.framework/libgzscript.macos.template_debug.arm64
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.macos.template_release.arm64.framework/libgzscript.macos.template_release.arm64
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.linux.template_debug.x86_64.so
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.linux.template_release.x86_64.so
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.linux.template_debug.arm64.so
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.linux.template_release.arm64.so
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.windows.template_debug.x86_64.dll
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.windows.template_release.x86_64.dll
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.windows.template_debug.arm64.dll
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.windows.template_release.arm64.dll
          test -f dist/gzscript/addons/gzscript/gzscript.gdextension
          test -f dist/gzscript/addons/gzscript/zig/godot.zig

      - name: Upload combined desktop artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: gzscript-desktop
          path: dist/gzscript/
          if-no-files-found: error
          retention-days: 14
