name: Build desktop artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bindings:
    name: Verify generated bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Zig 0.16.0
        run: sh .github/scripts/install-zig.sh

      - name: Test generators and Zig SDK
        run: |
          zig build test
          zig fmt --check build.zig tools addons/gzscript/zig/*.zig examples/basic/scripts tests

  quality:
    name: Quality (format, shellcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Zig 0.16.0
        run: sh .github/scripts/install-zig.sh

      - name: Install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck

      - name: Check shell scripts
        run: shellcheck -S warning tests/run.sh tests/run_integration_linux.sh tests/scripts/common.sh tests/lifecycle/run.sh tests/lifecycle/stress_shutdown.sh tests/fixtures/fake_tools/selftest.sh

      - name: Check Zig formatting and generators
        run: |
          zig fmt --check build.zig tools addons/gzscript/zig/*.zig examples/basic/scripts tests
          zig build check-bindings

  build:
    name: ${{ matrix.name }}
    needs: bindings
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x86_64
            runner: macos-15
            platform: macos
            arch: x86_64
            target: x86_64-macos
          - name: macOS ARM64
            runner: macos-15
            platform: macos
            arch: arm64
            target: aarch64-macos
          - name: Linux x86_64
            runner: ubuntu-24.04
            platform: linux
            arch: x86_64
            target: x86_64-linux-gnu
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            target: aarch64-linux-gnu
          - name: Windows x86_64
            runner: windows-2022
            platform: windows
            arch: x86_64
            target: x86_64-windows-gnu
          - name: Windows ARM64
            runner: windows-11-arm
            platform: windows
            arch: arm64
            target: aarch64-windows-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Zig 0.16.0
        shell: bash
        run: sh .github/scripts/install-zig.sh

      - name: Build debug library
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: zig build --prefix . -Dtarget="$TARGET" -Doptimize=Debug -j2

      - name: Build release library
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: zig build --prefix . -Dtarget="$TARGET" -Doptimize=ReleaseFast -j2

      - name: Upload platform binaries
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: gzscript-${{ matrix.platform }}-${{ matrix.arch }}
          path: addons/gzscript/bin/
          if-no-files-found: error
          retention-days: 1

  test-linux:
    name: Linux / ${{ matrix.label }}
    needs: [bindings, quality, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Unit
            group: unit
          - label: Compiler
            group: compiler
          - label: Cache
            group: cache
          - label: Concurrency
            group: concurrency
          - label: Runtime
            group: runtime
          - label: Lifecycle
            group: lifecycle
          - label: Diagnostics
            group: diagnostics
          - label: ZLS
            group: lsp
          - label: Editor
            group: editor
          - label: Integration
            group: integration

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Zig 0.16.0
        run: sh .github/scripts/install-zig.sh

      - name: Install ZLS 0.16.0
        run: |
          archive="$RUNNER_TEMP/zls.tar.xz"
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$archive" \
            "https://github.com/zigtools/zls/releases/download/0.16.0/zls-x86_64-linux.tar.xz"
          printf '%s  %s\n' \
            'ded6d562a0b86ee878b1ddf70ffab2797ce3cdca3b02d6077548f9d56dff96b6' \
            "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/zls" --version

      - name: Install Godot 4.7.1 stable
        run: |
          archive="$RUNNER_TEMP/godot.zip"
          install_dir="$RUNNER_TEMP/godot"
          bin_dir="$RUNNER_TEMP/bin"

          curl -fsSLo "$archive" \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          printf '%s  %s\n' \
            'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba' \
            "$archive" | sha256sum -c -

          mkdir -p "$install_dir" "$bin_dir"
          unzip -q "$archive" -d "$install_dir"
          install -m 755 \
            "$install_dir/Godot_v4.7.1-stable_linux.x86_64" \
            "$bin_dir/godot"
          "$bin_dir/godot" --version
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Download Linux x86_64 binaries
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: gzscript-linux-x86_64
          path: addons/gzscript/bin/
          if-no-files-found: error

      - name: Run ${{ matrix.group }} tests
        run: sh tests/run.sh --no-build --flake-check ${{ matrix.group }}

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: gzscript-junit-${{ matrix.group }}
          path: test-results/**/junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Collect crash diagnostics
        if: failure()
        run: |
          mkdir -p crash-diagnostics
          cp -r test-results crash-diagnostics/ 2>/dev/null || true
          {
            echo "=== pgrep zig ==="; pgrep -af "zig " || true
            echo "=== pgrep zls ==="; pgrep -af "zls" || true
            echo "=== core dumps ==="; coredumpctl list --no-pager 2>/dev/null || ls core* /var/crash 2>/dev/null || true
          } > crash-diagnostics/processes.txt 2>&1 || true

      - name: Upload crash diagnostics
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: gzscript-crash-diagnostics-${{ matrix.group }}
          path: crash-diagnostics/
          if-no-files-found: warn
          retention-days: 14

  smoke:
    name: Runtime Smoke / ${{ matrix.label }}
    needs: [bindings, quality, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            runner: ubuntu-24.04
            artifact: gzscript-linux-x86_64
            godot_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
            godot_bin: Godot_v4.7.1-stable_linux.x86_64
            godot_sha256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba
          - label: Linux ARM64
            runner: ubuntu-24.04-arm
            artifact: gzscript-linux-arm64
            godot_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.arm64.zip
            godot_bin: Godot_v4.7.1-stable_linux.arm64
            godot_sha256: ""
          - label: macOS ARM64
            runner: macos-15
            artifact: gzscript-macos-arm64
            godot_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_macos.universal.zip
            godot_bin: Godot.app/Contents/MacOS/Godot
            godot_sha256: ""
          - label: Windows x86_64
            runner: windows-2022
            artifact: gzscript-windows-x86_64
            godot_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_win64.exe.zip
            godot_bin: Godot_v4.7.1-stable_win64.exe
            godot_sha256: ""

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Zig 0.16.0
        shell: bash
        run: sh .github/scripts/install-zig.sh

      - name: Install Godot 4.7.1
        shell: bash
        env:
          GODOT_URL: ${{ matrix.godot_url }}
          GODOT_BIN_PATH: ${{ matrix.godot_bin }}
          GODOT_SHA256: ${{ matrix.godot_sha256 }}
        run: |
          archive="$RUNNER_TEMP/godot-pkg"
          curl -fsSLo "$archive" "$GODOT_URL"
          # TODO: pin checksums for the non-Linux-x86_64 Godot binaries.
          if [ -n "$GODOT_SHA256" ]; then
            printf '%s  %s\n' "$GODOT_SHA256" "$archive" | sha256sum -c -
          fi
          unzip -q "$archive" -d "$RUNNER_TEMP/godot"
          godot_exe="$RUNNER_TEMP/godot/$GODOT_BIN_PATH"
          chmod +x "$godot_exe"
          "$godot_exe" --version
          printf 'GODOT_BIN=%s\n' "$godot_exe" >> "$GITHUB_ENV"

      - name: Download platform binaries
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ matrix.artifact }}
          path: addons/gzscript/bin/
          if-no-files-found: error

      - name: Run runtime smoke test
        shell: bash
        run: sh tests/run.sh --no-build smoke

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: gzscript-smoke-${{ matrix.label }}
          path: test-results/smoke/
          if-no-files-found: warn
          retention-days: 14

  sanitizers-linux:
    name: Linux / ASan + UBSan
    needs: [bindings, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Zig 0.16.0
        run: sh .github/scripts/install-zig.sh

      - name: Install ZLS 0.16.0
        run: |
          archive="$RUNNER_TEMP/zls.tar.xz"
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$archive" \
            "https://github.com/zigtools/zls/releases/download/0.16.0/zls-x86_64-linux.tar.xz"
          printf '%s  %s\n' \
            'ded6d562a0b86ee878b1ddf70ffab2797ce3cdca3b02d6077548f9d56dff96b6' \
            "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/zls" --version

      - name: Install Godot 4.7.1 stable
        run: |
          archive="$RUNNER_TEMP/godot.zip"
          install_dir="$RUNNER_TEMP/godot"
          bin_dir="$RUNNER_TEMP/bin"

          curl -fsSLo "$archive" \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          printf '%s  %s\n' \
            'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba' \
            "$archive" | sha256sum -c -

          mkdir -p "$install_dir" "$bin_dir"
          unzip -q "$archive" -d "$install_dir"
          install -m 755 \
            "$install_dir/Godot_v4.7.1-stable_linux.x86_64" \
            "$bin_dir/godot"
          "$bin_dir/godot" --version
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build instrumented extension
        run: zig build --prefix . -Dtarget=x86_64-linux-gnu -Doptimize=Debug -Dsanitize=address,undefined -j2

      - name: Run lifecycle and compiler tests under sanitizers
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1:symbolize=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so):$(gcc -print-file-name=libubsan.so)"
          sh tests/run.sh --no-build lifecycle compiler

      - name: Run diagnostics concurrency tests under ThreadSanitizer
        run: GZSCRIPT_TSAN=1 sh tests/run.sh --no-build diagnostics/concurrency

      - name: Upload sanitizer results
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: gzscript-sanitizer-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Package combined artifact
    needs: [build, test-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout package sources
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Prepare package
        run: |
          mkdir -p dist/gzscript/addons
          cp LICENSE README.md dist/gzscript/
          cp -R addons/gzscript dist/gzscript/addons/
          rm -f \
            dist/gzscript/addons/gzscript/zig/class_support_test.zig \
            dist/gzscript/addons/gzscript/zig/class_support_test.zig.uid
          mkdir -p dist/gzscript/addons/gzscript/bin

      - name: Download all platform binaries
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: gzscript-*
          path: dist/gzscript/addons/gzscript/bin
          merge-multiple: true

      - name: Verify package contents
        run: |
          expected_root="$(printf '%s\n' LICENSE README.md addons | sort)"
          actual_root="$(find dist/gzscript -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          test "$actual_root" = "$expected_root"

          test -f dist/gzscript/LICENSE
          test -f dist/gzscript/README.md
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.macos.template_debug.x86_64.framework/libgzscript.macos.template_debug.x86_64
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.macos.template_release.x86_64.framework/libgzscript.macos.template_release.x86_64
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.macos.template_debug.arm64.framework/libgzscript.macos.template_debug.arm64
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.macos.template_release.arm64.framework/libgzscript.macos.template_release.arm64
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.linux.template_debug.x86_64.so
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.linux.template_release.x86_64.so
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.linux.template_debug.arm64.so
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.linux.template_release.arm64.so
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.windows.template_debug.x86_64.dll
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.windows.template_release.x86_64.dll
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.windows.template_debug.arm64.dll
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.windows.template_release.arm64.dll
          test -f dist/gzscript/addons/gzscript/gzscript.gdextension
          test -f dist/gzscript/addons/gzscript/zig/godot.zig
          test ! -e dist/gzscript/addons/gzscript/zig/class_support_test.zig
          test ! -e dist/gzscript/addons/gzscript/zig/class_support_test.zig.uid

      - name: Archive package and generate checksum
        run: |
          tar -czf dist/gzscript-desktop.tar.gz -C dist gzscript
          cd dist
          sha256sum gzscript-desktop.tar.gz > gzscript-desktop.tar.gz.sha256
          sha256sum -c gzscript-desktop.tar.gz.sha256

          tar -tzf gzscript-desktop.tar.gz gzscript/LICENSE > /dev/null
          if tar -tzf gzscript-desktop.tar.gz | grep -q 'class_support_test\.zig'; then
            echo "Development-only class support test found in release archive" >&2
            exit 1
          fi

      - name: Upload combined desktop artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: gzscript-desktop
          path: |
            dist/gzscript-desktop.tar.gz
            dist/gzscript-desktop.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
