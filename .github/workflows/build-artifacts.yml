name: Build desktop artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bindings:
    name: Verify generated bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Zig 0.16.0
        run: sh .github/scripts/install-zig.sh

      - name: Test generators and Zig SDK
        run: |
          zig build check-bindings
          zig build test
          zig fmt --check build.zig tools addons/gzscript/zig/*.zig examples/basic/scripts tests

  build:
    name: ${{ matrix.name }}
    needs: bindings
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x86_64
            runner: macos-15
            platform: macos
            arch: x86_64
            target: x86_64-macos
          - name: macOS ARM64
            runner: macos-15
            platform: macos
            arch: arm64
            target: aarch64-macos
          - name: Linux x86_64
            runner: ubuntu-24.04
            platform: linux
            arch: x86_64
            target: x86_64-linux-gnu
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            target: aarch64-linux-gnu
          - name: Windows x86_64
            runner: windows-2022
            platform: windows
            arch: x86_64
            target: x86_64-windows-gnu
          - name: Windows ARM64
            runner: windows-11-arm
            platform: windows
            arch: arm64
            target: aarch64-windows-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Zig 0.16.0
        shell: bash
        run: sh .github/scripts/install-zig.sh

      - name: Build debug library
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: zig build --prefix . -Dtarget="$TARGET" -Doptimize=Debug -j2

      - name: Build release library
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: zig build --prefix . -Dtarget="$TARGET" -Doptimize=ReleaseFast -j2

      - name: Upload platform binaries
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: gzscript-${{ matrix.platform }}-${{ matrix.arch }}
          path: addons/gzscript/bin/
          if-no-files-found: error
          retention-days: 1

  integration:
    name: Godot 4.7 integration (Linux x86_64)
    needs: bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Zig 0.16.0
        run: sh .github/scripts/install-zig.sh

      - name: Install Godot 4.7 stable
        run: |
          archive="$RUNNER_TEMP/godot.zip"
          install_dir="$RUNNER_TEMP/godot"
          bin_dir="$RUNNER_TEMP/bin"

          curl -fsSLo "$archive" \
            "https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip"
          printf '%s  %s\n' \
            '0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c' \
            "$archive" | sha256sum -c -

          mkdir -p "$install_dir" "$bin_dir"
          unzip -q "$archive" -d "$install_dir"
          install -m 755 \
            "$install_dir/Godot_v4.7-stable_linux.x86_64" \
            "$bin_dir/godot"
          "$bin_dir/godot" --version
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"

      - name: Run integration suite
        run: sh tests/run.sh

  package:
    name: Package combined artifact
    needs: [build, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout package sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare package
        run: |
          mkdir -p dist/gzscript/addons
          cp README.md dist/gzscript/
          cp -R addons/gzscript dist/gzscript/addons/
          mkdir -p dist/gzscript/addons/gzscript/bin

      - name: Download all platform binaries
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: gzscript-*
          path: dist/gzscript/addons/gzscript/bin
          merge-multiple: true

      - name: Verify package contents
        run: |
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.macos.template_debug.x86_64.framework/libgzscript.macos.template_debug.x86_64
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.macos.template_release.x86_64.framework/libgzscript.macos.template_release.x86_64
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.macos.template_debug.arm64.framework/libgzscript.macos.template_debug.arm64
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.macos.template_release.arm64.framework/libgzscript.macos.template_release.arm64
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.linux.template_debug.x86_64.so
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.linux.template_release.x86_64.so
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.linux.template_debug.arm64.so
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.linux.template_release.arm64.so
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.windows.template_debug.x86_64.dll
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.windows.template_release.x86_64.dll
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.windows.template_debug.arm64.dll
          test -f dist/gzscript/addons/gzscript/bin/libgzscript.windows.template_release.arm64.dll
          test -f dist/gzscript/addons/gzscript/gzscript.gdextension
          test -f dist/gzscript/addons/gzscript/zig/godot.zig

      - name: Upload combined desktop artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: gzscript-desktop
          path: dist/gzscript/
          if-no-files-found: error
          retention-days: 14
